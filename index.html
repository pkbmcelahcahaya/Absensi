<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi PKBM Celah Cahaya</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            max-width: 400px; 
            margin: 0 auto; 
            background-color: #f4f4f9; 
        }
        .container { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        
        /* --- GAYA LOGO --- */
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-img {
            max-width: 150px; /* Ukuran maksimal logo */
            width: 100%;      /* Agar responsif di HP kecil */
            height: auto;
            border-radius: 8px;
        }

        h2 { text-align: center; color: #333; margin-bottom: 5px; margin-top: 0;}
        .subtitle { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 25px; }
        
        label { font-weight: 600; color: #444; font-size: 0.9em; display: block; margin-top: 10px;}
        input, select { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        button { 
            width: 100%;
            padding: 14px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 6px;
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #status { text-align: center; margin-top: 15px; font-size: 0.9em; line-height: 1.5; padding: 12px; border-radius: 6px; display: none; }
        .error { background-color: #ffe6e6; color: #d63031; border: 1px solid #fab1a0; display: block !important; }
        .success { background-color: #e6fffa; color: #00b894; border: 1px solid #55efc4; display: block !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="https://github.com/pkbmcelahcahaya/Absensi/blob/main/logo_celahcahaya.png" alt="Logo PKBM" class="logo-img">
    </div>

    <h2>Absensi PKBM</h2>
    <p class="subtitle">Paket B & Paket C | Celah Cahaya</p>
    
    <label for="nama">Nama Lengkap:</label>
    <input type="text" id="nama" placeholder="Contoh: Budi Santoso">

    <label for="paket">Program:</label>
    <select id="paket">
        <option value="Paket B">Paket B</option>
        <option value="Paket C">Paket C</option>
    </select>

    <button id="btnAbsen" onclick="getLocation()">CEK LOKASI & ABSEN</button>
    <div id="status"></div>
</div>

<script>
    // --- KONFIGURASI UTAMA ---
    // Pastikan URL Script ini BENAR milik Anda
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzvrGdEi4nPpDHKVhiJEaiOcryu2jA0B39afuyOXq0nyyGFXxDTj2qsYSD4YVQB3Iy5Tw/exec'; 
    
    // Koordinat PKBM Celah Cahaya (Yang sudah diperbarui)
    const PUSAT_LAT = -7.4709888;   
    const PUSAT_LONG = 107.9355414;
    
    // Radius Toleransi (Meter)
    const RADIUS_METER = 50; 
    // -------------------------

    const btn = document.getElementById('btnAbsen');
    const statusDiv = document.getElementById('status');

    function getLocation() {
        const nama = document.getElementById('nama').value;
        if(nama.trim() === ""){
            alert("Harap isi Nama Lengkap terlebih dahulu!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Mendeteksi Lokasi...";
        statusDiv.style.display = "block";
        statusDiv.className = ""; 
        statusDiv.innerText = "Sedang mengambil koordinat GPS...";

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(cekJarakDanKirim, showError, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            statusDiv.className = "error";
            statusDiv.innerText = "Browser HP Anda tidak mendukung GPS.";
            btn.disabled = false;
        }
    }

    function cekJarakDanKirim(position) {
        const userLat = position.coords.latitude;
        const userLong = position.coords.longitude;
        const jarak = hitungJarak(userLat, userLong, PUSAT_LAT, PUSAT_LONG);
        
        // Cek Jarak
        if (jarak > RADIUS_METER) {
            btn.innerText = "GAGAL - KEJAUHAN";
            btn.style.backgroundColor = "#d63031"; 
            statusDiv.className = "error";
            statusDiv.innerHTML = `🚫 <b>Jarak Terlalu Jauh!</b><br>Anda berjarak <b>${Math.round(jarak)} meter</b> dari sekolah.<br>Maksimal: ${RADIUS_METER} meter.<br>Silakan masuk ke area sekolah.`;
            
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "CEK LOKASI & ABSEN";
                btn.style.backgroundColor = "#28a745";
                statusDiv.style.display = "none";
            }, 5000);
            return; 
        }

        // Jika jarak aman, kirim data
        sendPosition(userLat, userLong);
    }

    function sendPosition(lat, long) {
        btn.innerText = "Mengirim Data...";
        const nama = document.getElementById('nama').value;
        const paket = document.getElementById('paket').value;

        const data = { nama: nama, paket: paket, lat: lat, long: long };

        // Menggunakan mode 'no-cors' agar tidak diblokir browser
        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(data),
            mode: 'no-cors', 
            headers: { 'Content-Type': 'text/plain' }
        })
        .then(() => {
             // Karena no-cors, kita asumsikan data terkirim
             btn.innerText = "✅ DATA TERKIRIM";
             statusDiv.className = "success";
             statusDiv.innerHTML = `<b>Proses Selesai!</b><br>Terima kasih <b>${nama}</b>.<br>Jika belum absen hari ini, data tersimpan.`;
             
             // Reset Form
             document.getElementById('nama').value = "";
             
             setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "CEK LOKASI & ABSEN";
                statusDiv.style.display = "none";
            }, 5000);
        })
        .catch(error => {
            statusDiv.className = "error";
            statusDiv.innerText = "Gagal koneksi internet/server.";
            btn.disabled = false;
        });
    }

    // Rumus Matematika Menghitung Jarak (Haversine Formula)
    function hitungJarak(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Radius bumi meter
        const φ1 = lat1 * Math.PI/180; 
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; 
    }

    function showError(error) {
        btn.disabled = false;
        btn.innerText = "ULANGI ABSEN";
        statusDiv.className = "error";
        statusDiv.style.display = "block";
        switch(error.code) {
            case error.PERMISSION_DENIED:
                statusDiv.innerText = "Anda menolak akses Lokasi. Mohon Izinkan GPS.";
                break;
            case error.POSITION_UNAVAILABLE:
                statusDiv.innerText = "Sinyal GPS tidak ditemukan.";
                break;
            case error.TIMEOUT:
                statusDiv.innerText = "Waktu habis mencari sinyal GPS.";
                break;
            default:
                statusDiv.innerText = "Error GPS tidak diketahui.";
        }
    }
</script>

</body>
</html>
